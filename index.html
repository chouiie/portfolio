<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chau Nguyen: Personal site and portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="global.js"></script>
    <script type="module" src="index.js" defer></script>
</head>
<body>
    <h1 class="visually-hidden">Hi, I’m Chau! I find stories in data.</h1>

    <div class="hero">
        <div class="hero-left" aria-hidden="true">
            <p class="label greeting">hello world ✿</p>
            <span class="big">I find stories in</span>
            <p class="label">data science @ ucsd</p>
        </div>

        <div class="hero-cup">
            <button class="pet-cat" type="button" aria-label="Pet the cat">
                <svg viewBox="0 0 240 260" aria-hidden="true">
                    <defs>
                        <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
                            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="noise" />
                            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
                        </filter>
                        <filter id="doodle" x="-10%" y="-10%" width="120%" height="120%">
                            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="noise" />
                            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
                        </filter>
                    </defs>

                    <g filter="url(#crayon)" stroke="#1f4fa0" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="120" cy="230" rx="108" ry="21" fill="#f4f1ea" stroke-width="3.5" />
                        <path d="M90 222 L94 236 H152 L156 222" fill="#f4f1ea" stroke-width="3" />
                        <path d="M50 168 Q20 160 16 182 Q14 202 66 204" fill="none" stroke-width="4" />
                        <path d="M42 146 A80 16 0 0 1 202 146 A80 16 0 0 1 42 146 Z" fill="#f4f1ea" stroke-width="3.5" />
                        <ellipse cx="122" cy="149" rx="70" ry="11" fill="#fff" stroke="none" />
                    </g>

                    <g class="head" filter="url(#doodle)" stroke="#141414" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M64 176 Q52 140 54 106 Q56 68 80 50 Q93 42 103 52 L115 66 Q124 63 133 66 L145 52 Q155 42 166 52 Q188 72 186 106 Q186 140 176 176 Z" fill="#fff" stroke-width="5.5" />

                        <g class="eyes-open" fill="#141414" stroke="none">
                            <ellipse cx="102" cy="112" rx="5" ry="3.8" />
                            <path d="M134 108 L146 112" stroke="#141414" stroke-width="5" fill="none" />
                        </g>
                        <g class="eyes-happy" fill="none" stroke-width="4.5">
                            <path d="M94 114 q8 -9 16 0" />
                            <path d="M132 114 q8 -9 16 0" />
                        </g>
                        <g class="eyes-sleepy" fill="none" stroke-width="4.5">
                            <path d="M94 112 q8 5 16 0" />
                            <path d="M132 112 q8 5 16 0" />
                        </g>

                        <path d="M116 118 q4 -2 8 0" fill="none" stroke-width="4" />
                        <path d="M106 128 q4 4 9 0 q4 -4 8 -1 q4 3 9 -2" fill="none" stroke-width="4" />
                        <path d="M38 116 H68 M42 136 L66 126 M172 112 H202 M170 120 L196 132" fill="none" stroke-width="4.5" />
                    </g>

                    <g filter="url(#crayon)" stroke="#1f4fa0" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M42 146 A80 16 0 0 0 202 146 L176 212 Q172 224 160 224 H84 Q72 224 68 212 Z" fill="#f4f1ea" stroke-width="3.5" />
                    </g>
                    <text x="122" y="200" text-anchor="middle" font-family="DM Mono, monospace" font-size="20" font-weight="500" letter-spacing="1" fill="#1f4fa0">pet me</text>

                    <g filter="url(#doodle)" fill="#fff" stroke="#141414" stroke-width="4.5">
                        <ellipse cx="96" cy="157" rx="14" ry="9" />
                        <ellipse cx="148" cy="157" rx="14" ry="9" />
                    </g>
                </svg>
            </button>
            <p class="cat-says" aria-live="polite">click to pet ♡</p>
        </div>

        <div class="hero-right" aria-hidden="true">
            <em class="big">data.</em>
        </div>
    </div>

    <p class="last-updated">last updated <span class="updated-date"></span></p>
</body>
</html>
