<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chau Nguyen: Personal site and portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="global.js"></script>
    <script type="module" src="carousel.js"></script>
</head>
<body>
    <h1>Chau Nguyen</h1>
    <p>Welcome to my personal site and portfolio! Here you can find information about my projects, skills, and experiences. Feel free to explore and reach out if you have any questions or opportunities!</p>

    <section class="carousel" aria-roledescription="carousel" aria-labelledby="about-heading">
        <h2 id="about-heading">Get to know me ✨</h2>
        <div class="slides" tabindex="0">
            <figure class="slide" aria-roledescription="slide" aria-label="1 of 5">
                <img src="images/profile-2.jpg" alt="Chau standing on a cliff above the ocean at sunset">
                <figcaption>
                    <h2>Hi, my name is Chau!</h2>
                </figcaption>
            </figure>
            <figure class="slide" aria-roledescription="slide" aria-label="2 of 5">
                <img src="images/slide-food.jpg" alt="Creamy udon topped with salmon roe and a soft egg next to a tuna rice bowl with seaweed and an egg yolk">
                <figcaption>
                    <h2>Eating good food 🍜</h2>
                    <p>I'm always on the hunt for a new spot to try.</p>
                </figcaption>
            </figure>
            <figure class="slide" aria-roledescription="slide" aria-label="3 of 5">
                <img src="images/slide-froyo.jpg" alt="Two cups of frozen yogurt, one topped with pistachio, in a white Greek-style shop">
                <figcaption>
                    <h2>Sweet treats 🍦</h2>
                    <p>There's always room for dessert.</p>
                </figcaption>
            </figure>
            <figure class="slide" aria-roledescription="slide" aria-label="4 of 5">
                <img src="images/slide-matcha.jpg" alt="Bright green matcha being poured over milk in an iced cup">
                <figcaption>
                    <h2>Drinking matcha 🍵</h2>
                    <p>My forever favorite drink.</p>
                </figcaption>
            </figure>
            <figure class="slide" aria-roledescription="slide" aria-label="5 of 5">
                <img src="images/slide-beach.jpg" alt="Sandy beach at sunset with people walking below tall golden cliffs">
                <figcaption>
                    <h2>I love pondering at the beach 🌊</h2>
                </figcaption>
            </figure>
        </div>

        <button class="carousel-prev" aria-label="Previous slide">‹</button>
        <button class="carousel-next" aria-label="Next slide">›</button>
        <div class="carousel-dots"></div>
    </section>

</body>
</html>
